server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: true

database:
  mongodb_uri: ${MONGODB_URI:-mongodb://localhost:27017}
  database_name: wcag_scanner

security:
  jwt_secret: ${JWT_SECRET:-change-this-secret-key-in-production}
  jwt_access_expiry: 900      # 15 minutes (in seconds)
  jwt_refresh_expiry: 604800  # 7 days (in seconds)
  cors_origins:
    - http://localhost:3000
    - http://localhost:8000

logging:
  level: INFO
  format: json  # json or standard

queue:
  worker_count: 5
  max_queue_size: 1000
  job_timeout: 300  # 5 minutes

scanning:
  default_scanners:
    - axe
    - html_validator
    - contrast
    - keyboard
    - aria
  max_pages: 50
  max_depth: 3
  timeout: 120
